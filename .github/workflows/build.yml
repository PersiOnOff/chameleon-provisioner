name: Build Flipper Application (.fap)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .fap using official uFBT Action
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.3
        with:
          task: build
          app-dir: .
          sdk-channel: release

      - name: Upload .fap artifact
        uses: actions/upload-artifact@v4
        with:
          name: chameleon_provisioner-fap
          path: ${{ steps.build.outputs.fap-dir }}/*.fap

      - name: Attach .fap to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.fap-dir }}/*.fap
